site_name: LADSource Wiki
site_description: Developer guides and LADBot API reference for Like a Dragon Source
site_url: https://team-lad-s.github.io/LADSource-Docs/
repo_url: https://github.com/Team-LAD-S/LADSource-Docs
repo_name: Team-LAD-S/LADSource-Docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

hooks:
  - hooks/navigation.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/module-table-sort.js

copyright: Copyright &copy; Team LADS. LADSource is licensed under GPL-3.0.
